# ========================================================
# College Vehicle Booking System - Spring Boot Configuration
# Task 3 (JPA & Spring MVC) and Task 4 (Spring Boot REST)
# ========================================================

# Server Port (Runs on 8082 to avoid conflict with Tomcat on 8081/8080)
server.port=8082

# Application Context Path
server.servlet.context-path=/

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/college_vehicle_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# Logging
logging.level.com.yuvraj=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
